<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LAST 30 DAYS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101713;color:#eee9d9;font:14px ui-monospace,Consolas,monospace}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #000}.panel{background:#101713dd;border:1px solid #657365;padding:8px 10px;min-width:155px}.bar{height:7px;background:#39443c;margin:4px 0 7px}.fill{height:100%;background:#78a86b;width:100%}#stats{text-align:right}#toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#121a16;border:1px solid #d5ad5b;padding:10px 15px;opacity:0;pointer-events:none}#bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.slot{background:#101713dd;border:2px solid #657365;width:54px;height:49px;text-align:center;padding:4px;font-size:11px}.slot b{font-size:19px;display:block}.active{border-color:#e0b65c!important}#help{position:fixed;bottom:10px;left:10px;font-size:11px;color:#c4cabb;background:#101713bb;padding:6px}
#overlay{position:fixed;inset:0;background:#080d0bea;display:grid;place-items:center;padding:15px;z-index:3}#menu{width:min(600px,96vw);max-height:92vh;overflow:auto;background:#18211c;border:2px solid #71806e;padding:24px}h1{font-size:clamp(32px,7vw,55px);line-height:.95;color:#e6bd68;margin:0;letter-spacing:2px}h2{color:#e6bd68}p{line-height:1.5;color:#c3cbbf}.eyebrow{font-size:11px;letter-spacing:3px;color:#9eac9c;margin-bottom:12px}button{font:inherit;color:#f5efdf;background:#35483a;border:1px solid #8a9b83;padding:10px 13px;margin:4px;cursor:pointer}button.primary{background:#805e2e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#101713;border:1px solid #465448;padding:10px}.small{font-size:11px;color:#aeb9a9}.row{display:flex;flex-wrap:wrap;margin-top:12px}
#mobile{display:none;position:fixed;bottom:75px;left:12px;right:12px;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,43px);gap:3px;pointer-events:auto}.pad button{margin:0;padding:8px 0;touch-action:none}.actions{display:flex;align-items:end;pointer-events:auto}.actions button{width:52px;height:52px;padding:2px;touch-action:none}
@media(max-width:700px){#mobile{display:flex}#help{display:none}.panel{min-width:125px;padding:5px;font-size:11px}.slot{width:44px;height:43px}#bottom{bottom:5px}}
</style></head><body><canvas id="game"></canvas>
<div id="hud"><div class="panel"><div id="day">DAY 1 / 30</div>HEALTH<div class="bar"><div id="hp" class="fill"></div></div>HUNGER<div class="bar"><div id="foodbar" class="fill" style="background:#d3a24e"></div></div>THIRST<div class="bar"><div id="waterbar" class="fill" style="background:#5b9dc1"></div></div></div><div class="panel" id="stats"><div id="clock">08:00 AM</div><div id="weather">CLEAR</div><div id="kills">KILLS 0</div><div id="goal">SURVIVE 30 DAYS</div></div></div>
<div id="toast"></div><div id="bottom"></div><div id="help">WASD move · Mouse click attack · E loot · Q eat · R drink · C craft · B build · I inventory · 1-5 select</div>
<div id="mobile"><div class="pad"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div class="actions"><button id="hit">⚔</button><button id="use">E</button></div></div>
<div id="overlay"><div id="menu"></div></div>
<script>
(()=>{'use strict';
const cv=document.querySelector('canvas'),c=cv.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const T=32,N=90,R=(a,b)=>a+Math.random()*(b-a),I=(a,b)=>Math.floor(R(a,b+1)),C=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),pick=a=>a[I(0,a.length-1)];
let keys={},mouse={x:W/2,y:H/2},cam={x:0,y:0},mode='menu',toastT=0,day=1,time=480,weather='CLEAR',night=false,spawnT=0,buildMode=null,selected=0;
const p={x:N*T/2,y:N*T/2,hp:100,hunger:100,thirst:100,speed:145,kills:0,attack:0,invuln:0,weapon:'knife'};
let map=[],houses=[],zombies=[],loot=[],props=[],bullets=[],inv={wood:0,stone:0,scrap:0,cloth:0,food:3,water:3,medkit:1,ammo:0,herb:0,board:0,bandage:0,pistol:0,shotgun:0},extract=false;
const recipes=[['Bandage',{cloth:2},()=>inv.bandage++,'Heal 25'],['Medkit',{cloth:3,herb:2},()=>inv.medkit++,'Heal 65'],['Boards x2',{wood:3},()=>inv.board+=2,'Building material'],['Pistol',{scrap:6,wood:2},()=>inv.pistol++,'Ranged weapon'],['Shotgun',{scrap:10,wood:4,board:2},()=>inv.shotgun++,'Powerful close-range weapon'],['Ammo x8',{scrap:2},()=>inv.ammo+=8,'For guns']];
function say(s){$('toast').textContent=s;$('toast').style.opacity=1;toastT=2.3}
function screen(title,html,buttons){$('overlay').style.display='grid';$('menu').innerHTML='<div class="eyebrow">A SURVIVAL GAME</div><h1>'+title+'</h1>'+html+'<div class="row">'+buttons.map((b,i)=>'<button class="'+(!i?'primary':'')+'" data-b="'+i+'">'+b[0]+'</button>').join('')+'</div>';$('menu').querySelectorAll('[data-b]').forEach((e,i)=>e.onclick=buttons[i][1])}
function title(){mode='menu';screen('LAST 30<br>DAYS','<p>The town has fallen. A rescue helicopter will sweep the valley on Day 30. Scavenge abandoned buildings, craft equipment, fight the infected and reach the extraction zone.</p><div class="grid"><div class="card"><b>SCAVENGE</b><p class="small">Search houses, shops and wrecks.</p></div><div class="card"><b>SURVIVE</b><p class="small">Manage health, hunger and thirst.</p></div><div class="card"><b>FIGHT</b><p class="small">Use your knife or craft firearms.</p></div><div class="card"><b>BUILD</b><p class="small">Place barricades and campfires.</p></div></div><p class="small">WASD to move · E interact · Click attack · C craft · B build · I inventory · Q eat · R drink</p>',[['NEW GAME',start],['CONTINUE',load],['HOW TO PLAY',help]])}
function help(){screen('FIELD MANUAL','<p><b>Loot:</b> Walk near a glowing supply and press E. Search buildings by their doors.</p><p><b>Combat:</b> Click to swing your knife or fire your equipped gun. Guns consume ammo.</p><p><b>Survival:</b> Hunger and thirst drain over time. Eat food, drink water and heal with supplies.</p><p><b>Craft/build:</b> C opens crafting. B lets you place a barricade or campfire on a nearby clear tile.</p><p><b>Extraction:</b> Survive until Day 30, then reach the glowing zone in the north-east and press E.</p>',[['BACK',title]])}
function start(){map=Array.from({length:N},()=>Array.from({length:N},()=>({type:'grass',solid:false})));houses=[];zombies=[];loot=[];props=[];bullets=[];day=1;time=480;weather='CLEAR';extract=false;Object.assign(p,{x:N*T/2,y:N*T/2,hp:100,hunger:100,thirst:100,kills:0,weapon:'knife'});inv={wood:0,stone:0,scrap:0,cloth:0,food:3,water:3,medkit:1,ammo:0,herb:0,board:0,bandage:0,pistol:0,shotgun:0};
for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(x<2||y<2||x>=N-2||y>=N-2)map[y][x]={type:'water',solid:true};else if(Math.random()<.07)map[y][x].type='dirt';
for(let i=0;i<110;i++){let x=I(3,N-4),y=I(3,N-4),type=pick(['tree','tree','tree','rock','bush','wreck']);if(dist({x:x*T,y:y*T},p)<250)continue;map[y][x]={type,solid:['tree','rock','wreck'].includes(type)}}
for(let i=0;i<24;i++){let x=I(7,N-12),y=I(7,N-12),w=I(3,5),h=I(3,5);if(dist({x:x*T,y:y*T},p)<230)continue;let ok=true;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(!['grass','dirt'].includes(map[yy][xx].type))ok=false;if(!ok)continue;let b={x,y,w,h,kind:pick(['HOUSE','SHOP','CLINIC','GARAGE']),searched:false,door:{x:x+Math.floor(w/2),y:y+h}};houses.push(b);for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy][xx]={type:'building',solid:true};map[b.door.y][b.door.x]={type:'door',solid:false}}
for(let i=0;i<90;i++){let x=I(3,N-4),y=I(3,N-4);if(['grass','dirt'].includes(map[y][x].type))drop(x*T+16,y*T+16)}
for(let i=0;i<13;i++)zspawn(R(80,N*T-80),R(80,N*T-80));mode='play';$('overlay').style.display='none';say('Find supplies. The clock is ticking.');hud();save()}
function drop(x,y){loot.push({x,y,item:pick(['food','water','scrap','cloth','wood','stone','ammo','medkit','herb']),n:I(1,3)})}
function zspawn(x,y,type){zombies.push({x,y,type:type||pick(['walker','walker','runner','brute']),hp:type==='brute'?90:type==='runner'?34:50,speed:type==='brute'?38:type==='runner'?91:56,hit:0,cd:0})}
function solid(x,y){let tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=N||ty>=N||map[ty][tx].solid)return true;return props.some(s=>s.hp>0&&Math.floor(s.x/T)===tx&&Math.floor(s.y/T)===ty&&s.type==='barricade')}
function move(e,dx,dy){if(!solid(e.x+dx,e.y)&&!solid(e.x+dx,e.y-7)&&!solid(e.x+dx,e.y+7))e.x+=dx;if(!solid(e.x,e.y+dy)&&!solid(e.x-7,e.y+dy)&&!solid(e.x+7,e.y+dy))e.y+=dy}
function nearby(){return loot.findIndex(l=>dist(p,l)<44)}
function interact(){let i=nearby();if(i>=0){let l=loot.splice(i,1)[0];inv[l.item]=(inv[l.item]||0)+l.n;say('+'+l.n+' '+l.item.toUpperCase());hud();return}let h=houses.find(b=>Math.hypot(p.x-(b.door.x*T+16),p.y-(b.door.y*T+16))<58);if(h){if(h.searched){say('Already searched.');return}h.searched=true;for(let n=0;n<I(3,6);n++)drop((h.x+R(0,h.w))*T,(h.y+R(0,h.h))*T);say(h.kind+' searched. Supplies found!');return}if(day>=30&&p.x>N*T-240&&p.y<240){finish(true);return}say('Nothing useful nearby.')}
function use(k){if(!inv[k]){say('You have none.');return}inv[k]--;if(k==='food')p.hunger=C(p.hunger+36,0,100);if(k==='water')p.thirst=C(p.thirst+42,0,100);if(k==='medkit')p.hp=C(p.hp+65,0,100);if(k==='bandage')p.hp=C(p.hp+25,0,100);hud()}
function attack(){if(mode!=='play'||p.attack>0)return;p.attack=.32;let gun=['pistol','shotgun'].includes(p.weapon);if(gun&&!inv.ammo){say('Out of ammo!');return}if(gun){inv.ammo--;let a=Math.atan2(mouse.y+cam.y-p.y,mouse.x+cam.x-p.x);for(let i=0;i<(p.weapon==='shotgun'?5:1);i++){let ang=a+R(-.16,.16);bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*520,vy:Math.sin(ang)*520,life:1,damage:p.weapon==='shotgun'?24:40})}}else{let z=zombies.filter(z=>dist(p,z)<58).sort((a,b)=>dist(p,a)-dist(p,b))[0];if(z){z.hp-=36;z.hit=.15;if(z.hp<=0)kill(z)}else say('Too far away!')}hud()}
function kill(z){zombies.splice(zombies.indexOf(z),1);p.kills++;if(Math.random()<.7)drop(z.x,z.y);say('Infected eliminated.')}
function craft(){mode='craft';screen('CRAFTING','<p>Scavenged materials become survival gear.</p><div class="grid">'+recipes.map((r,i)=>'<div class="card"><b>'+r[0]+'</b><p class="small">'+r[3]+'</p><p class="small">'+Object.entries(r[1]).map(([k,v])=>v+' '+k).join(' · ')+'</p><button data-craft="'+i+'">CRAFT</button></div>').join('')+'</div>',[['CLOSE',resume]]);$('menu').querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>{let r=recipes[+b.dataset.craft];if(Object.entries(r[1]).some(([k,v])=>(inv[k]||0)<v)){say('Not enough materials.');return}Object.entries(r[1]).forEach(([k,v])=>inv[k]-=v);r[2]();say('Crafted '+r[0]);craft()})}
function inventory(){mode='inventory';screen('BACKPACK','<div class="grid">'+Object.entries(inv).filter(([k,v])=>v>0).map(([k,v])=>'<div class="card"><b>'+k.toUpperCase()+'</b><p class="small">Quantity: '+v+'</p>'+(['food','water','medkit','bandage'].includes(k)?'<button data-use="'+k+'">USE</button>':'')+'</div>').join('')+'</div><p>Equipped: '+p.weapon.toUpperCase()+'</p><button data-weapon="knife">KNIFE</button><button data-weapon="pistol">PISTOL</button><button data-weapon="shotgun">SHOTGUN</button>',[['CLOSE',resume]]);$('menu').querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{use(b.dataset.use);inventory()});$('menu').querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>{let k=b.dataset.weapon;if(k==='knife'||inv[k]){p.weapon=k;inventory()}else say('You have not crafted this weapon.')})}
function build(){mode='build';screen('BUILD CAMP','<p>Select a structure, then click an empty nearby tile to place it.</p><div class="grid"><div class="card"><b>BARRICADE</b><p class="small">3 boards · blocks infected</p><button data-build="barricade">SELECT</button></div><div class="card"><b>CAMPFIRE</b><p class="small">5 wood + 2 stone · lights the night</p><button data-build="campfire">SELECT</button></div></div>',[['CLOSE',resume]]);$('menu').querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{buildMode=b.dataset.build;resume();say('Click a clear tile nearby. ESC cancels.')})}
function place(x,y){if(!buildMode)return;let tx=Math.floor(x/T),ty=Math.floor(y/T);if(dist(p,{x,y})>155||solid(x,y)||tx<1||ty<1||tx>=N-1||ty>=N-1){say('Cannot build there.');return}if(buildMode==='barricade'){if(inv.board<3){say('Need 3 boards.');return}inv.board-=3;props.push({x:tx*T+16,y:ty*T+16,type:buildMode,hp:150})}else{if(inv.wood<5||inv.stone<2){say('Need 5 wood and 2 stone.');return}inv.wood-=5;inv.stone-=2;props.push({x:tx*T+16,y:ty*T+16,type:buildMode,hp:999})}buildMode=null;hud();say('Built!')}
function resume(){mode='play';$('overlay').style.display='none'}
function clock(){let h=Math.floor(time/60)%24,m=Math.floor(time%60);return String(h%12||12).padStart(2,'0')+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')}
function hud(){$('day').textContent='DAY '+day+' / 30';$('hp').style.width=C(p.hp,0,100)+'%';$('foodbar').style.width=p.hunger+'%';$('waterbar').style.width=p.thirst+'%';$('clock').textContent=clock();$('weather').textContent=weather+(night?' · NIGHT':'');$('kills').textContent='KILLS '+p.kills;$('goal').textContent=day<30?'SURVIVE '+(30-day)+' MORE DAYS':'REACH EXTRACTION';$('bottom').innerHTML=['knife','pistol','shotgun','food','water'].map((k,i)=>'<div class="slot '+(selected===i?'active':'')+'"><b>'+['†','⌁','▰','🥫','💧'][i]+'</b>'+k+'<br>'+(i===0?1:inv[k]||0)+'</div>').join('')}
function save(){try{localStorage.setItem('last30-save',JSON.stringify({p,inv,day,time,weather,zombies,loot,props,houseSearched:houses.map(h=>h.searched)}))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem('last30-save'));if(!d)throw 0;start();Object.assign(p,d.p);inv=d.inv;day=d.day;time=d.time;weather=d.weather;zombies=d.zombies||[];loot=d.loot||[];props=d.props||[];houses.forEach((h,i)=>h.searched=!!d.houseSearched?.[i]);resume();say('Save loaded.');hud()}catch(e){say('No save found. Starting fresh.');start()}}
function finish(win){mode='over';save();screen(win?'YOU MADE IT':'YOU DID NOT SURVIVE',win?'<p>The helicopter spotted your signal. Thirty days in hell, and you made it out.</p><h2>FINAL SCORE: '+p.kills+' KILLS</h2>':'<p>The town claimed another survivor on Day '+day+'. You eliminated '+p.kills+' infected.</p>',[['PLAY AGAIN',start],['MAIN MENU',title]])}
function update(dt){if(mode!=='play')return;time+=dt*7.5;if(time>=1440){time-=1440;day++;weather=pick(['CLEAR','CLOUDY','RAIN']);say('DAY '+day+' · '+weather);for(let i=0;i<6+day;i++)zspawn(R(70,N*T-70),R(70,N*T-70));if(day>=30){day=30;extract=true}save()}night=time<360||time>1140;p.hunger=C(p.hunger-dt*.22,0,100);p.thirst=C(p.thirst-dt*.34,0,100);if(!p.hunger||!p.thirst)p.hp-=dt*(!p.thirst?2:1);if(night){spawnT+=dt;if(spawnT>Math.max(4,16-day*.3)){spawnT=0;zspawn(R(60,N*T-60),R(60,N*T-60))}}p.attack=Math.max(0,p.attack-dt);p.invuln=Math.max(0,p.invuln-dt);
let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);move(p,dx/l*p.speed*dt,dy/l*p.speed*dt)}
for(let z of [...zombies]){let d=dist(p,z);if(d<520){if(d>22)move(z,(p.x-z.x)/(d||1)*z.speed*dt,(p.y-z.y)/(d||1)*z.speed*dt);else if(z.cd<=0&&p.invuln<=0){p.hp-=z.type==='brute'?17:8;p.invuln=.7;z.cd=1;say('You are being attacked!')}}z.cd=Math.max(0,z.cd-dt);z.hit=Math.max(0,z.hit-dt)}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let z=zombies.find(z=>dist(z,b)<15);if(z){z.hp-=b.damage;b.life=0;if(z.hp<=0)kill(z)}}bullets=bullets.filter(b=>b.life>0);
for(let s of props.filter(s=>s.type==='barricade'))for(let z of zombies)if(dist(s,z)<30&&z.cd<=0){s.hp-=8;z.cd=.8}props=props.filter(s=>s.hp>0);
if(p.hp<=0){finish(false);return}if(extract&&p.x>N*T-235&&p.y<235&&keys.e){finish(true);return}cam.x=C(p.x-W/2,0,N*T-W);cam.y=C(p.y-H/2,0,N*T-H);if(toastT>0&&((toastT-=dt)<=0))$('toast').style.opacity=0;hud()}
function draw(){c.fillStyle='#253a2b';c.fillRect(0,0,W,H);let sx=Math.floor(cam.x/T),sy=Math.floor(cam.y/T),ex=Math.ceil((cam.x+W)/T)+1,ey=Math.ceil((cam.y+H)/T)+1;
for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){if(x<0||y<0||x>=N||y>=N)continue;let t=map[y][x],a=x*T-cam.x,b=y*T-cam.y;c.fillStyle=t.type==='water'?'#254b58':t.type==='dirt'?'#66563c':'#344b36';c.fillRect(a,b,T,T);if(t.type==='grass'&&Math.random()<.003){c.fillStyle='#466443';c.fillRect(a+8,b+8,2,2)}if(t.type==='tree'){c.fillStyle='#60432d';c.fillRect(a+13,b+17,7,14);c.fillStyle='#24442e';c.fillRect(a+4,b+3,24,22);c.fillStyle='#365a3c';c.fillRect(a+9,b+1,13,14)}if(t.type==='rock'){c.fillStyle='#858477';c.fillRect(a+5,b+9,22,17)}if(t.type==='bush'){c.fillStyle='#587442';c.fillRect(a+4,b+10,24,16)}if(t.type==='wreck'){c.fillStyle='#876348';c.fillRect(a+3,b+10,26,14)}if(t.type==='building'){c.fillStyle='#6c5845';c.fillRect(a+1,b+1,30,30);c.fillStyle='#9b8163';c.fillRect(a+4,b+4,24,24);c.fillStyle='#51483c';c.fillRect(a+8,b+8,16,16)}if(t.type==='door'){c.fillStyle='#a77b49';c.fillRect(a+5,b+3,22,28)}}
for(let l of loot){let x=l.x-cam.x,y=l.y-cam.y;c.fillStyle='#e4c36c';c.fillRect(x-5,y-5,10,10);c.fillStyle='#fff2bd';c.fillRect(x-2,y-2,4,4)}
for(let s of props){let x=s.x-cam.x,y=s.y-cam.y;c.fillStyle=s.type==='campfire'?'#e58c36':'#8d6943';c.fillRect(x-12,y-9,24,18);if(s.type==='campfire'){c.fillStyle='#ffcf62';c.fillRect(x-3,y-15,6,14)}}
for(let z of zombies){let x=z.x-cam.x,y=z.y-cam.y;c.fillStyle=z.hit?'#fff':z.type==='brute'?'#81483f':z.type==='runner'?'#a4a44e':'#788d63';c.fillRect(x-8,y-11,z.type==='brute'?18:15,21);c.fillStyle='#e5d8b3';c.fillRect(x-5,y-6,3,3);c.fillRect(x+2,y-6,3,3)}
for(let b of bullets){c.fillStyle='#ffdb81';c.fillRect(b.x-cam.x-2,b.y-cam.y-2,4,4)}
let x=p.x-cam.x,y=p.y-cam.y;c.fillStyle='#d3b78d';c.fillRect(x-7,y-11,14,17);c.fillStyle='#344b59';c.fillRect(x-8,y+5,16,9);c.fillStyle='#252a2b';c.fillRect(x-6,y-14,12,6);
